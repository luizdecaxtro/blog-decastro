<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog DeCastro — Gestão, negócios e conhecimento aplicado</title>
<meta name="description" content="Artigos sobre gestão empresarial, finanças e empreendedorismo, do canal DeCastro | O Canal do Conhecimento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html">Blog DeCastro</a>
    <a class="voltar" href="https://lojasdecastro.com.br">← Voltar para lojasdecastro.com.br</a>
  </div>
</header>

<main>
  <h1>Blog DeCastro</h1>
  <p class="subtitulo">Conteúdo sobre gestão empresarial, finanças e empreendedorismo para quem está começando ou já toca o próprio negócio.</p>

  <div id="posts-lista">
    <p style="font-family: var(--fonte-ui); color: var(--cor-texto-suave);">Carregando posts…</p>
  </div>
</main>

<footer class="site">
  Blog DeCastro | O Canal do Conhecimento — <a href="https://lojasdecastro.com.br">lojasdecastro.com.br</a>
</footer>

<script>
  // Troque pela URL do seu Worker depois do deploy
  // (ex: "https://blog-decastro-cms.SEU-SUBDOMINIO.workers.dev")
  const API_BASE = "https://blog-decastro-cms.intelectus247.workers.dev";

  function formatarData(iso) {
    if (!iso) return "";
    const d = new Date(iso.replace(" ", "T") + "Z");
    return d.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
  }

  async function carregarPosts() {
    const container = document.getElementById("posts-lista");
    try {
      const r = await fetch(API_BASE + "/api/posts");
      const posts = await r.json();
      if (!Array.isArray(posts) || posts.length === 0) {
        container.innerHTML = '<p style="font-family: var(--fonte-ui); color: var(--cor-texto-suave);">Nenhum post publicado ainda.</p>';
        return;
      }
      container.innerHTML = posts.map((p) => `
        <article class="post-card">
          ${p.cover_image ? `<a href="post.html?slug=${encodeURIComponent(p.slug)}"><img class="capa-lista" src="${p.cover_image}" alt="${p.title}"></a>` : ""}
          ${p.tag ? `<span class="tag">${p.tag}</span>` : ""}
          <p class="data">${formatarData(p.created_at)}</p>
          <h2><a href="post.html?slug=${encodeURIComponent(p.slug)}">${p.title}</a></h2>
          <p class="resumo">${p.summary || ""}</p>
          <a class="leia-mais" href="post.html?slug=${encodeURIComponent(p.slug)}">Leia mais →</a>
        </article>
      `).join("");
    } catch (e) {
      container.innerHTML = '<p style="font-family: var(--fonte-ui); color: var(--cor-texto-suave);">Não foi possível carregar os posts agora. Tente recarregar a página.</p>';
    }
  }

  carregarPosts();
</script>

</body>
</html>
